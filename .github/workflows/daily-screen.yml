name: 盘后缠论选股

# ------------------------------------------------------------
#  每个交易日收盘后自动运行：
#    1. 拉取全市场 A 股 / ETF 快照
#    2. 过滤 动态市盈率>0、非ST、非北交所
#    3. 拉取 30 分钟与 5 分钟 K 线，跑缠论二买/三买
#    4. 结果写回 data/ 并提交，GitHub Pages 自动更新
# ------------------------------------------------------------

on:
  schedule:
    # UTC 07:40 = 北京时间 15:40，周一至周五。A股 15:00 收盘，留 40 分钟等数据落地
    - cron: '40 7 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: '只扫描前 N 只（调试用，留空 = 全市场）'
        required: false
        default: ''
      codes:
        description: '指定标的，逗号分隔，如 600519,000001,510300（留空 = 全市场）'
        required: false
        default: ''
      concurrency:
        description: '并发线程数（留空 = 用 config.yaml 里的值）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-chan-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缠论引擎自检
        run: python scripts/selftest.py

      - name: 恢复分钟K线缓存
        uses: actions/cache@v4
        with:
          path: .cache
          key: chan-bars-${{ github.run_id }}
          restore-keys: |
            chan-bars-

      - name: 执行盘后筛选
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          CODES: ${{ github.event.inputs.codes }}
          CONC: ${{ github.event.inputs.concurrency }}
        run: |
          ARGS=""
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ -n "$CODES" ] && ARGS="$ARGS --codes $CODES"
          [ -n "$CONC" ]  && ARGS="$ARGS --concurrency $CONC"
          echo "运行参数: python scripts/screener.py $ARGS"
          python scripts/screener.py $ARGS

      - name: 提交结果
        run: |
          git config user.name  "chan-screener-bot"
          git config user.email "chan-screener-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "本次无数据变化，跳过提交"
          else
            git commit -m "data: 更新 $(date -u -d '+8 hours' +%Y-%m-%d) 盘后缠论买点筛选结果"
            git push
          fi

      - name: 上传结果产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-result-${{ github.run_number }}
          path: data/
          retention-days: 14
          if-no-files-found: warn
