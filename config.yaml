# ============================================================
#  A股 / ETF 缠论多级别买点筛选 —— 参数配置
#  改完直接提交，GitHub Actions 下次运行即生效
# ============================================================

# ---------- 股票池基础过滤 ----------
universe:
  exclude_st: true            # 排除 ST / *ST / 退市整理
  exclude_bse: true           # 排除北交所（43x / 83x / 87x / 88x / 920）
  require_positive_pe: true   # 动态市盈率必须为正（<=0 或 亏损 一律剔除）
  min_amount: 0               # 成交额下限（元）。0 = 不限制。示例：30000000 = 3000万
  min_total_mv: 0             # 总市值下限（元）。0 = 不限制。示例：2000000000 = 20亿

# ---------- 缠论级别参数 ----------
levels:
  m30:
    period: "30"
    lookback_days: 150        # 回溯日历天数（30分钟K线，约够 3 个月交易日）
    max_bars_ago: 16          # 买点有效期：距最新K线不超过 16 根 ≈ 2 个交易日
    min_gap: 4                # 笔的最小分型间隔（4 = 分型之间至少 1 根独立K线）
    beichi_ratio: 0.85        # 背驰阈值：本笔动能 / 前同向笔动能 < 该值判为背驰
    require_beichi_for_buy2: false   # 二买是否必须由背驰确认（true 更严格，信号更少）
  m5:
    period: "5"
    lookback_days: 40         # 5分钟K线回溯（约 25 个交易日）
    max_bars_ago: 48          # 约 1 个交易日
    min_gap: 4
    beichi_ratio: 0.85
    require_beichi_for_buy2: false

# ---------- 买点类型 ----------
# "2" = 二买，"3" = 三买。需求就是这两个，一般不用改。
buy_kinds: ["2", "3"]

# ---------- 有效性校验 ----------
# 最新价相对买点价位的允许跌破幅度，超出则视为信号失效
break_tolerance: 0.005

# ---------- 性能 ----------
concurrency: 8                # 并发线程数，Actions 上 8~12 比较稳

# ---------- ETF ----------
etf:
  enabled: true
  same_type_limit: 1          # 同类型 ETF 只保留 N 只（按得分取最高的）
